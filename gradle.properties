org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Caché de configuración: Gradle guarda el resultado de configurar el proyecto y lo reutiliza en la siguiente
# compilación si los scripts no han cambiado. Más rápido en cada `./gradlew`; no afecta a la APK ni a los tests.
org.gradle.configuration-cache=true
# Caché de compilación: reutiliza las salidas de tareas ya ejecutadas con las mismas entradas.
org.gradle.caching=true
