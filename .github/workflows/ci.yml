# Integración continua de CellCase: comprueba todo el proyecto en cada envío y en cada solicitud de cambios.
#
# - core:   pruebas del núcleo (JUnit), pruebas de JVM de la app y generación de los PDF de muestra.
# - app:    lint, APK debug y release (sin firmar) y tamaño de la release.
# - datos:  catálogos de textos es/en, determinismo de las muestras de ICdetector 3.0 y verificación de las muestras
#           contra el código de ICdetector v2.10.5 y v3.0.0.
# - device: pruebas instrumentadas (app/src/androidTest) en un emulador.
#
# Ejecutores fijados en Ubuntu 24.04 (no ubuntu-latest) para que la imagen (y su SDK de Android) sea reproducible.
#
# Sin secretos, sin firma y sin publicar nada: solo compila, prueba y guarda los resultados como artefactos.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  core:
    name: Núcleo y pruebas de JVM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # El SDK de Android ya viene en la imagen ubuntu-24.04 (ANDROID_HOME); Gradle descarga la plataforma y las
      # build-tools que falten con las licencias ya aceptadas en el ejecutor. android-actions/setup-android falla en
      # las imágenes recientes y no hace falta.
      - name: Comprobar el SDK de Android del ejecutor
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | head -20
          test -d "$ANDROID_HOME/licenses" && ls "$ANDROID_HOME/licenses"
      - name: Pruebas del núcleo y de la app en la JVM
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest
      - name: PDF de muestra (mismo código que la app)
        run: ./gradlew --stacktrace :core:sampleReport
      - name: Resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-pruebas
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

  app:
    name: Compilar la app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # El SDK de Android ya viene en la imagen ubuntu-24.04 (ANDROID_HOME); Gradle descarga la plataforma y las
      # build-tools que falten con las licencias ya aceptadas en el ejecutor. android-actions/setup-android falla en
      # las imágenes recientes y no hace falta.
      - name: Comprobar el SDK de Android del ejecutor
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | head -20
          test -d "$ANDROID_HOME/licenses" && ls "$ANDROID_HOME/licenses"
      - name: Lint, APK debug y release
        run: ./gradlew --stacktrace :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Tamaño de la APK release
        run: |
          ls -l app/build/outputs/apk/*/
          python3 tools/apk_size.py app/build/outputs/apk/release/*.apk || true
      - name: APK y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-y-lint
          path: |
            app/build/outputs/apk/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  datos:
    name: Textos y muestras frente a ICdetector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catálogos de textos es/en (mismas claves, marcadores y plurales)
        run: python3 tools/i18n/check_catalogs.py core/src/main/resources/cellcase/i18n/messages_es.txt core/src/main/resources/cellcase/i18n/messages_en.txt
      - name: Las muestras de ICdetector 3.0 se regeneran idénticas
        run: |
          python3 tools/synth/generate_icd30.py
          git status --porcelain samples/synthetic/icd30
          test -z "$(git status --porcelain samples/synthetic/icd30)"
      - name: Código de ICdetector v2.10.5
        uses: actions/checkout@v4
        with:
          repository: alexisgordr/ICdetector
          ref: v2.10.5
          path: icdetector-2.10.5
      - name: Código de ICdetector v3.0.0
        uses: actions/checkout@v4
        with:
          repository: alexisgordr/ICdetector
          ref: v3.0.0
          path: icdetector-3.0.0
      - name: Muestras 2.10.5 = código de ICdetector v2.10.5
        run: python3 tools/synth/verify_against_source.py icdetector-2.10.5
      - name: Muestras 3.0 = código de ICdetector v3.0.0
        run: python3 tools/synth/verify_icd30_against_source.py icdetector-3.0.0

  device:
    name: Pruebas instrumentadas (emulador)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # El SDK de Android ya viene en la imagen ubuntu-24.04 (ANDROID_HOME); Gradle descarga la plataforma y las
      # build-tools que falten con las licencias ya aceptadas en el ejecutor. android-actions/setup-android falla en
      # las imágenes recientes y no hace falta.
      - name: Comprobar el SDK de Android del ejecutor
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | head -20
          test -d "$ANDROID_HOME/licenses" && ls "$ANDROID_HOME/licenses"
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest
      - name: Resultados del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-instrumentadas
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
